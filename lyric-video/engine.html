@font-face{font-family:N;font-weight:900;src:url(fonts/nunito-latin-900-normal.woff2);unicode-range:U+0000-00FF,U+2000-206F}

</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
const W = 1080, H = 1920, D = window.DATA, FPS = D.fps;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const EMOJI_FONT = "'Noto Color Emoji'";

// ---------- утилиты ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = k => (k = clamp(k), k * k * (3 - 2 * k));
const easeOut = k => 1 - Math.pow(1 - clamp(k), 3);
const easeIn = k => Math.pow(clamp(k), 3);
const easeBack = (k, c = 2.2) => { k = clamp(k); return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const easeElastic = k => { k = clamp(k); if (k === 0 || k === 1) return k; return Math.pow(2, -10 * k) * Math.sin((k * 10 - 0.75) * (2 * Math.PI / 3)) + 1; };
function hash(n) { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); }
function lastLE(arr, t) { let lo = 0, hi = arr.length - 1, r = -1; while (lo <= hi) { const m = (lo + hi) >> 1; if (arr[m] <= t) { r = m; lo = m + 1; } else hi = m - 1; } return r; }
function env(name, t) { const a = D.env[name]; const i = clamp(t * FPS, 0, a.length - 1); const i0 = Math.floor(i); return lerp(a[i0], a[Math.min(a.length - 1, i0 + 1)], i - i0); }
function pulse(arr, t, decay) { const i = lastLE(arr, t); return i < 0 ? 0 : Math.exp(-(t - arr[i]) / decay); }
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

// ---------- палитра ----------
const C = {
  yellow:  { a: "#FFE65C", b: "#FFB300", dark: "#A3420B", acc: "#FF2E4D" },
  orange:  { a: "#FFB65C", b: "#FF5E1A", dark: "#8A2A0A", acc: "#FFF15C" },
  pink:    { a: "#FFA3CF", b: "#FF479B", dark: "#8C1048", acc: "#FFF15C" },
  coral:   { a: "#FF907F", b: "#F23D5C", dark: "#7A0F2E", acc: "#FFF15C" },
  magenta: { a: "#F57BFF", b: "#BE1FE0", dark: "#5E0F73", acc: "#FFF15C" },
  violet:  { a: "#A994FF", b: "#6C2BEA", dark: "#300A73", acc: "#FFE65C" },
  plum:    { a: "#D02F8C", b: "#4E1689", dark: "#24073F", acc: "#FFD84D" },
  indigo:  { a: "#7A6CFF", b: "#3317B0", dark: "#14085E", acc: "#7CF5FF" },
  ice:     { a: "#A6EEFF", b: "#3B7BF6", dark: "#14307A", acc: "#FFFFFF" },
  red:     { a: "#FF6A3D", b: "#D3082C", dark: "#4F0606", acc: "#FFE65C" },
};
const SEQ = {
  intro: ["yellow"], verse: ["pink", "orange", "coral", "yellow", "magenta"],
  verse2: ["magenta", "violet", "pink", "orange"], verse3: ["violet", "yellow", "magenta", "coral"],
  hook: ["violet", "orange", "pink", "orange"], gazan: ["plum", "indigo", "plum", "magenta"],
  final: ["red", "orange", "yellow", "coral", "red", "magenta"], outro: ["red"],
};
const HOT = { intro: 1, hook: 1, final: 1, outro: 1 };

// ---------- эмодзи-стикеры к словам ----------
const EMO = [
  [/^гор(и|ишь|ю)|огон|огн/, "🔥"], [/дорож/, "💸"], [/школ/, "🎒"], [/работа/, "💪"], [/бокал/, "🥂"],
  [/пенит/, "🫧"], [/агони/, "🥵"], [/вареник/, "🥟"], [/микро/, "🎤"], [/^трек/, "🎶"], [/холодок/, "🥶"],
  [/дракон/, "🐉"], [/завёз|завез/, "🚚"], [/утюг/, "📺"], [/пушка/, "💥"], [/распаков/, "📦"],
  [/игрушк/, "🧸"], [/^хит/, "🏆"], [/^бит/, "🥁"], [/голов/, "🤯"], [/фейм/, "⭐"], [/монопол/, "💰"],
  [/hello/, "👋"], [/хулиган/, "😈"], [/любишь/, "💖"], [/этаж/, "🏙️"], [/^pop/, "🎉"], [/сделал/, "😳"],
  [/пилотаж/, "✈️"], [/сердце/, "💓"], [/врум/, "🏎️"], [/бум/, "💥"], [/город/, "🌆"], [/шоурум/, "🪩"],
  [/замира/, "🧊"], [/ладон/, "🙌"], [/узнает/, "📢"], [/любовь/, "💘"], [/паранойя/, "🌀"], [/^ля/, "🎵"], [/сорри/, "🙊"],
];
const FLY = { "✈️": 1, "🏎️": 1 };
const SMALL = new Set("и в с на у я а но не по про под из это что ты мы тут тот все всё как весь этот щас ща it make эй каждый пусть".split(" "));

const clean = s => s.replace(/[.,!?:;…—–"«»]/g, "").replace(/^-+|-+$/g, "");
const norm = s => clean(s).toLowerCase().replace(/ё/g, "е");

// ---------- секции и строки ----------
const SECS = D.sections;
const LINES = D.lines;
const allWords = [];
LINES.forEach((l, li) => {
  let si = 0; for (let i = 0; i < SECS.length; i++) if (SECS[i].line <= li) si = i;
  l.si = si; l.type = SECS[si].type; l.hot = !!HOT[l.type];
  const idxInSec = li - SECS[si].line;
  const seq = SEQ[l.type] || SEQ.verse;
  l.col = seq[idxInSec % seq.length];
  l.emos = [];
  l.words.forEach((w, wi) => {
    w.txt = clean(w.w).toUpperCase(); w.li = li;
    const n = norm(w.w);
    w.small = SMALL.has(n) || n.length <= 1;
    for (const [rx, e] of EMO) if (rx.test(n)) { w.emo = e; break; }
    if (/холодок/.test(n)) l.col = "ice";
    if (w.emo && l.emos.length < 2 && !l.emos.some(x => x.e === w.emo)) l.emos.push({ e: w.emo, s: w.s, wi });
    w.key = !!w.emo && !w.small;
    w.fire = /^гор(и|ишь|ю)|огон|огн/.test(n);
    allWords.push(w);
  });
  // не допускаем одинаковый цвет подряд
  if (li > 0 && LINES[li - 1].col === l.col) l.col = seq[(idxInSec + 1) % seq.length] === l.col ? "violet" : seq[(idxInSec + 1) % seq.length];
  const modes = ["pop", "drop", "slide", "pop", "spin"];
  l.mode = l.hot ? "stamp" : modes[Math.floor(hash(li * 3.7) * modes.length)];
});
const LAST_END = LINES[LINES.length - 1].e;
const OUTRO_S = LAST_END + 0.1;
const fireTimes = allWords.filter(w => w.fire).map(w => w.s);
const boomTimes = allWords.filter(w => /бум/.test(norm(w.w))).map(w => w.s);
const glitchW = allWords.filter(w => /паранойя/.test(norm(w.w)));
const freezeW = allWords.filter(w => /замира/.test(norm(w.w)));
const kicks = D.kicks;

// замедление фона на «замирает»: интегрируем скорость покадрово
const WARP = new Float32Array(Math.ceil(D.dur * FPS) + 2);
for (let f = 1; f < WARP.length; f++) {
  const t = f / FPS; let sp = 1;
  for (const w of freezeW) if (t > w.s && t < w.s + 1.2) sp = Math.min(sp, lerp(0.03, 1, smooth((t - w.s - 0.75) / 0.45)));
  WARP[f] = WARP[f - 1] + sp / FPS;
}
const warp = t => { const i = clamp(t * FPS, 0, WARP.length - 2); const i0 = Math.floor(i); return lerp(WARP[i0], WARP[i0 + 1], i - i0); };
const freezeAmt = t => { let m = 0; for (const w of freezeW) m = Math.max(m, smooth((t - w.s) / 0.15) * (1 - smooth((t - w.s - 0.7) / 0.35))); return m; };

function lineAt(t) { let r = -1; for (let i = 0; i < LINES.length; i++) if (LINES[i].s - 0.12 <= t) r = i; return r; }

// ---------- спрайты эмодзи с белой обводкой ----------
const emoCache = {};
function emoSprite(e) {
  if (emoCache[e]) return emoCache[e];
  const S = 300, c = document.createElement("canvas"); c.width = c.height = S + 60;
  const g = c.getContext("2d");
  g.font = `${S * 0.78}px ${EMOJI_FONT}`; g.textAlign = "center"; g.textBaseline = "middle";
  const cx = (S + 60) / 2, cy = (S + 60) / 2 + S * 0.04;
  // мягкая тень
  g.save(); g.shadowColor = "rgba(0,0,0,0.35)"; g.shadowBlur = 0; g.shadowOffsetY = 14;
  for (let a = 0; a < 16; a++) { const r = 13; g.fillText(e, cx + Math.cos(a / 16 * 6.283) * r, cy + Math.sin(a / 16 * 6.283) * r); }
  g.restore();
  // белая наклейка
  g.save(); g.globalCompositeOperation = "source-atop"; g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.restore();
  g.fillText(e, cx, cy);
  return (emoCache[e] = c);
}

// ---------- фон ----------
function bgFill(col, cx, cy) {
  const p = C[col];
  const g = ctx.createRadialGradient(cx, cy, 60, cx, cy, H * 0.85);
  g.addColorStop(0, p.a); g.addColorStop(1, p.b);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function drawBG(t, tw, li, kick) {
  const l = li >= 0 ? LINES[li] : LINES[0];
  const prev = li > 0 ? LINES[li - 1] : l;
  const col = t > OUTRO_S ? "red" : l.col;
  const k = easeOut((t - (l.s - 0.12)) / 0.34);
  const cx = W / 2, cy = H * 0.45;
  if (k < 1 && li > 0 && t <= OUTRO_S) {
    bgFill(prev.col, cx, cy);
    ctx.save();
    const kind = li % 3, ox = W * (0.2 + 0.6 * hash(li * 9.1)), oy = H * (0.25 + 0.5 * hash(li * 4.3));
    ctx.beginPath();
    if (kind === 0) ctx.arc(ox, oy, k * H * 1.25, 0, 7);
    else if (kind === 1) { const x = lerp(-W * 1.2, 0, k); ctx.moveTo(x, 0); ctx.lineTo(x + W * 1.6, 0); ctx.lineTo(x + W * 1.2, H); ctx.lineTo(x - W * 0.4, H); }
    else { for (let b = 0; b < 4; b++) { const kb = easeOut(((t - (l.s - 0.12)) / 0.34) * 1.4 - b * 0.12); ctx.rect(b * W / 4, H - kb * H, W / 4 + 1, kb * H); } }
    ctx.clip(); bgFill(col, cx, cy); ctx.restore();
  } else bgFill(col, cx, cy);
  // лучи
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(tw * 0.12); ctx.scale(1 + 0.05 * kick, 1 + 0.05 * kick);
  ctx.fillStyle = `rgba(255,255,255,${0.07 + 0.05 * kick})`;
  for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, H * 1.1, a, a + Math.PI / 14); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  // мягкие пятна
  ctx.save(); ctx.globalCompositeOperation = "soft-light";
  for (let i = 0; i < 4; i++) {
    const x = W * (0.5 + 0.45 * Math.sin(tw * (0.17 + i * 0.05) + i * 2)), y = H * (0.5 + 0.42 * Math.cos(tw * (0.13 + i * 0.04) + i));
    const r = 380 + 120 * i;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, "rgba(255,255,255,0.55)"); g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
}

// плавающие фигурки (кружки, кольца, плюсики, зигзаги)
function drawFloaters(t, tw, kick, dark) {
  ctx.save();
  for (let i = 0; i < 26; i++) {
    const sp = 40 + 90 * hash(i * 2.1), span = H + 300;
    const y = H + 150 - ((tw * sp + hash(i * 5.7) * span) % span);
    const x = W * hash(i * 3.9) + Math.sin(tw * 0.8 + i) * 30;
    const s = (18 + 34 * hash(i * 7.3)) * (1 + 0.25 * kick);
    const kind = i % 4, rot = tw * (hash(i) - 0.5) * 2 + i;
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = "#fff"; ctx.fillStyle = "#fff"; ctx.lineWidth = 7; ctx.lineCap = "round"; ctx.lineJoin = "round";
    if (kind === 0) { ctx.beginPath(); ctx.arc(0, 0, s * 0.35, 0, 7); ctx.fill(); }
    else if (kind === 1) { ctx.beginPath(); ctx.arc(0, 0, s * 0.5, 0, 7); ctx.stroke(); }
    else if (kind === 2) { ctx.beginPath(); ctx.moveTo(-s / 2, 0); ctx.lineTo(s / 2, 0); ctx.moveTo(0, -s / 2); ctx.lineTo(0, s / 2); ctx.stroke(); }
    else { ctx.beginPath(); ctx.moveTo(-s * 0.7, 0); for (let z = 1; z <= 4; z++) ctx.lineTo(-s * 0.7 + z * s * 0.35, z % 2 ? -s * 0.25 : s * 0.25); ctx.stroke(); }
    ctx.restore();
  }
  ctx.restore();
}

function star(x, y, r) { ctx.beginPath(); ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r); ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r); ctx.fill(); }
function drawSparkles(t, tw, amount, beat) {
  if (amount <= 0) return;
  ctx.save();
  for (let i = 0; i < 34; i++) {
    const x = W * hash(i * 1.7 + 3), y = H * hash(i * 2.9 + 1);
    const tw2 = 0.5 + 0.5 * Math.sin(tw * (2 + 3 * hash(i)) + i * 1.3);
    const r = (14 + 30 * hash(i * 4.4)) * (0.4 + 0.6 * tw2) * (1 + 0.5 * beat);
    ctx.globalAlpha = amount * (0.5 + 0.5 * tw2);
    ctx.fillStyle = i % 3 ? "#FFE36B" : "#FFFFFF";
    ctx.shadowColor = "rgba(255,230,120,0.9)"; ctx.shadowBlur = 16;
    star(x, y, r);
  }
  ctx.restore();
}

// мультяшное пламя
function flame(x, base, w, h, sway, colors) {
  colors.forEach((c, i) => {
    const s = 1 - i * 0.3, ww = w * s, hh = h * (1 - i * 0.22), sw = sway * (1 - i * 0.3);
    ctx.fillStyle = c; ctx.beginPath();
    ctx.moveTo(x - ww / 2, base);
    ctx.bezierCurveTo(x - ww * 0.62, base - hh * 0.45, x - ww * 0.1 + sw * 0.5, base - hh * 0.62, x + sw, base - hh);
    ctx.bezierCurveTo(x + ww * 0.25 + sw * 0.5, base - hh * 0.6, x + ww * 0.62, base - hh * 0.42, x + ww / 2, base);
    ctx.quadraticCurveTo(x, base + ww * 0.28, x - ww / 2, base);
    ctx.fill();
  });
}
const FLAME_COL = ["#E8202A", "#FF7A00", "#FFD93B"];
function drawFlames(t, tw, amt, low) {
  if (amt <= 0.01) return;
  ctx.save();
  ctx.shadowColor = "rgba(120,0,0,0.25)"; ctx.shadowBlur = 0; ctx.shadowOffsetY = -8;
  const n = 7;
  for (let i = 0; i < n; i++) {
    const x = (i + 0.5) / n * W + Math.sin(tw * 1.3 + i) * 12;
    const h = amt * (260 + 220 * hash(i * 5.5)) * (0.85 + 0.15 * Math.sin(tw * 9 + i * 2) + 0.35 * low);
    flame(x, H + 40, W / n * 1.5, h, Math.sin(tw * 6 + i * 1.7) * 40, FLAME_COL);
  }
  ctx.restore();
}
function bigFlame(t, tw, amt, low) {
  if (amt <= 0.01) return;
  ctx.save(); ctx.globalAlpha = clamp(amt);
  const h = H * 0.62 * amt * (0.92 + 0.08 * Math.sin(tw * 8) + 0.12 * low);
  flame(W / 2, H * 0.78, W * 0.78, h, Math.sin(tw * 4) * 60, FLAME_COL);
  ctx.restore();
}

// ---------- раскладка текста ----------
const layoutCache = new Map();
function wscale(w, l) { return w.small ? 0.6 : (w.key ? 1.18 : 1); }
function layout(li) {
  if (layoutCache.has(li)) return layoutCache.get(li);
  const l = LINES[li], maxW = 920;
  let base = l.hot ? 168 : 140, rows;
  for (; base > 40; base -= 4) {
    const wd = l.words.map(w => { ctx.font = `900 ${base * wscale(w, l)}px N`; return ctx.measureText(w.txt).width; });
    if (Math.max(...wd) > maxW) continue;
    rows = []; let cur = [], cw = 0;
    const sp = base * 0.22;
    wd.forEach((w, i) => {
      if (cur.length && cw + sp + w > maxW) { rows.push({ idx: cur, w: cw }); cur = []; cw = 0; }
      cw += (cur.length ? sp : 0) + w; cur.push(i);
    });
    rows.push({ idx: cur, w: cw });
    const totalH = rows.reduce((a, r) => a + Math.max(...r.idx.map(i => base * wscale(l.words[i], l))) * 1.02, 0);
    if (rows.length <= 4 && totalH < 820) break;
  }
  const sp = base * 0.22;
  const rowH = rows.map(r => Math.max(...r.idx.map(i => base * wscale(l.words[i], l))) * 1.02);
  const total = rowH.reduce((a, b) => a + b, 0);
  const cy = H * 0.5 + (l.hot ? -40 : ((li % 3) - 1) * 60);
  let y = cy - total / 2;
  const pos = [];
  rows.forEach((r, ri) => {
    y += rowH[ri];
    let x = W / 2 - r.w / 2;
    r.idx.forEach(i => {
      const sz = base * wscale(l.words[i], l);
      ctx.font = `900 ${sz}px N`; const wd = ctx.measureText(l.words[i].txt).width;
      pos[i] = { x: x + wd / 2, y: y - rowH[ri] * 0.14, w: wd, sz, tilt: (hash(li * 31 + i) - 0.5) * 0.07 };
      x += wd + sp;
    });
  });
  const res = { pos, top: cy - total / 2, bottom: cy + total / 2, base };
  layoutCache.set(li, res); return res;
}

function stickerText(txt, sz, fill, dark) {
  ctx.lineJoin = "round"; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.font = `900 ${sz}px N`;
  // жёсткая тень-подложка
  ctx.fillStyle = dark; ctx.strokeStyle = dark; ctx.lineWidth = sz * 0.16;
  ctx.strokeText(txt, sz * 0.02, sz * 0.085); ctx.fillText(txt, sz * 0.02, sz * 0.085);
  ctx.lineWidth = sz * 0.11; ctx.strokeText(txt, 0, 0);
  ctx.fillStyle = fill; ctx.fillText(txt, 0, 0);
}

function drawLine(li, t, kick) {
  const l = LINES[li];
  const exitS = l.e - 0.13, exitE = l.e + 0.08;
  if (t < l.s - 0.1 || t > exitE + 0.05) return;
  const L = layout(li), p = C[l.col];
  l.words.forEach((w, wi) => {
    const q = L.pos[wi]; if (!q) return;
    const dt = t - (w.s - 0.05); if (dt < 0) return;
    const ex = clamp((t - exitS - wi * 0.012) / 0.14);
    let x = q.x, y = q.y, sc = 1, rot = q.tilt, a = 1;
    const k = dt / 0.3;
    switch (l.mode) {
      case "pop": sc = easeBack(k, 2.6); rot += (1 - easeOut(k)) * 0.3; break;
      case "drop": y -= 260 * (1 - easeElastic(k * 0.8)); a = clamp(k * 5); break;
      case "slide": { const d = wi % 2 ? 1 : -1; x += d * 420 * (1 - easeBack(k, 1.6)); a = clamp(k * 4); sc = lerp(0.6, 1, easeOut(k)); break; }
      case "spin": sc = easeBack(k, 2); rot += (1 - easeOut(k)) * -1.2; break;
      case "stamp": sc = lerp(2.4, 1, easeOut(dt / 0.16)) * (dt > 0.16 ? 1 + 0.08 * Math.exp(-(dt - 0.16) / 0.06) : 1); a = clamp(dt / 0.06); break;
    }
    const active = t >= w.s && t < (w.e || w.s + 0.4);
    if (active) { sc *= 1.07; rot += Math.sin(t * 18) * 0.02; }
    sc *= 1 + 0.03 * kick;
    sc *= 1 - easeIn(ex); rot += ex * 0.5;
    if (sc <= 0.01) return;
    ctx.save(); ctx.globalAlpha = clamp(a);
    ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, Math.max(0.01, sc * (l.mode === "drop" && k < 1 ? 1 + 0.12 * Math.sin(k * 9) * (1 - k) : 1)));
    const fill = w.key ? p.acc : "#FFFFFF";
    stickerText(w.txt, q.sz, fill, p.dark);
    ctx.restore();
  });
  // бэк-вокал — наклейка-плашка
  l.adlibs.forEach((ad, ai) => {
    const dt = t - ad.s; if (dt < 0) return;
    const ex = clamp((t - exitS) / 0.16);
    const sc = easeBack(dt / 0.28, 2.4) * (1 - easeIn(ex)); if (sc <= 0.01) return;
    const txt = ad.w.toUpperCase().replace(/;.*/, "");
    ctx.save(); ctx.font = "900 50px N";
    const tw = ctx.measureText(txt).width + 56;
    const right = (li + ai) % 2 === 0;
    const x = right ? W - 90 - tw / 2 : 90 + tw / 2, y = L.bottom + 110 + ai * 90;
    ctx.translate(x, Math.min(y, H - 420)); ctx.rotate((right ? 1 : -1) * 0.08 + Math.sin(t * 7) * 0.03); ctx.scale(sc, sc);
    ctx.fillStyle = C[l.col].dark; roundRect(-tw / 2 + 6, -42 + 9, tw, 84, 42); ctx.fill();
    ctx.fillStyle = "#fff"; roundRect(-tw / 2, -42, tw, 84, 42); ctx.fill();
    ctx.fillStyle = C[l.col].b; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(txt, 0, 3);
    ctx.restore();
  });
}

// эмодзи-стикеры рядом с блоком текста
function drawEmojis(li, t, kick) {
  const l = LINES[li]; if (!l) return;
  const L = layout(li);
  const exitS = l.e - 0.13;
  l.emos.forEach((em, ei) => {
    const dt = t - (em.s - 0.03); if (dt < 0) return;
    const ex = clamp((t - exitS) / 0.18);
    const spr = emoSprite(em.e);
    let size = ei === 0 ? 270 : 190;
    const above = (li + ei) % 2 === 0;
    let x = W / 2 + (ei === 0 ? (hash(li * 7) - 0.5) * 360 : (hash(li * 7) > 0.5 ? -300 : 300));
    let y = above ? L.top - size * 0.62 - 20 : L.bottom + size * 0.62 + 30;
    y = clamp(y, 330, H - 380);
    let sc = easeBack(dt / 0.35, 2.8) * (1 - easeIn(ex)), rot = Math.sin(t * 3 + li) * 0.12 + (1 - easeOut(dt / 0.35)) * 0.8;
    if (FLY[em.e]) { // пролетает через экран
      const k = clamp(dt / 1.6); x = lerp(-250, W + 250, easeOut(k * 1.1) * 0.5 + k * 0.5); y = L.top - 200 - Math.sin(k * 3.14) * 120; sc = 1 - easeIn(ex); rot = -0.15;
    }
    y += Math.sin(t * 4 + ei) * 12 - kick * 18;
    if (sc <= 0.01) return;
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, sc);
    ctx.drawImage(spr, -size / 2, -size / 2, size, size);
    ctx.restore();
  });
}

function drawBadge(t) {
  for (const s of SECS) {
    if (!s.artist) continue;
    const dt = t - (s.s - 0.15); if (dt < 0 || dt > 3) continue;
    const a = easeBack(dt / 0.4, 1.8), out = easeIn((dt - 2.6) / 0.4);
    const txt = "🎤 " + s.artist;
    ctx.save(); ctx.font = "900 46px N";
    const tw = ctx.measureText(txt).width + 70;
    ctx.translate(W / 2, lerp(200, 300, a) - out * 120); ctx.rotate(-0.03); ctx.globalAlpha = clamp(a * 2) * (1 - out);
    ctx.fillStyle = "rgba(25,6,40,0.88)"; roundRect(-tw / 2, -44, tw, 88, 44); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(txt, 0, 3);
    ctx.restore();
  }
}

function drawRings(t) {
  ctx.save();
  for (const b of boomTimes) {
    for (let r = 0; r < 2; r++) {
      const dt = t - b - r * 0.12; if (dt < 0 || dt > 0.7) continue;
      const k = dt / 0.7;
      ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - k)})`; ctx.lineWidth = 26 * (1 - k) + 4;
      ctx.beginPath(); ctx.arc(W / 2, H * 0.5, 120 + 1000 * easeOut(k), 0, 7); ctx.stroke();
    }
  }
  ctx.restore();
}

// искры-конфетти при словах про огонь
function drawBursts(t) {
  ctx.save();
  for (const k of fireTimes) {
    const dt = t - k; if (dt < 0 || dt > 1.1) continue;
    for (let j = 0; j < 18; j++) {
      const a = hash(k * 31 + j) * 6.283, sp = 700 + 900 * hash(k * 7 + j);
      const f = (1 - Math.exp(-3 * dt)) / 3;
      const x = W / 2 + Math.cos(a) * sp * f, y = H * 0.5 + Math.sin(a) * sp * f + 500 * dt * dt;
      ctx.globalAlpha = 1 - dt / 1.1;
      ctx.fillStyle = FLAME_COL[j % 3];
      ctx.save(); ctx.translate(x, y); ctx.rotate(dt * 8 + j);
      if (j % 2) ctx.fillRect(-12, -6, 24, 12); else star(0, 0, 18);
      ctx.restore();
    }
  }
  ctx.restore();
}

function drawOutro(t, tw, low) {
  const k = t - OUTRO_S; if (k < 0) return;
  const words = ["ТЫ", "ГОРИШЬ", "КАК", "ОГОНЬ", "2"];
  const rows = [["ТЫ", "ГОРИШЬ"], ["КАК", "ОГОНЬ"], ["2"]];
  let i = 0;
  rows.forEach((r, ri) => {
    const sz = ri === 2 ? 260 : 150;
    ctx.font = `900 ${sz}px N`;
    const total = r.reduce((a, w) => a + ctx.measureText(w).width, 0) + (r.length - 1) * 30;
    let x = W / 2 - total / 2;
    r.forEach(w => {
      const wd = ctx.measureText(w).width;
      const dt = k - i * 0.16; i++;
      if (dt > 0) {
        const sc = easeBack(dt / 0.3, 2.6) * (1 + 0.03 * low);
        ctx.save(); ctx.translate(x + wd / 2, H * 0.36 + ri * 175 + (ri === 2 ? 110 : 0)); ctx.rotate((hash(i) - 0.5) * 0.12); ctx.scale(sc, sc);
        stickerText(w, sz, ri === 2 ? "#FFE65C" : "#fff", "#4F0606"); ctx.restore();
      }
      x += wd + 30;
    });
  });
  const a = clamp((k - 0.9) / 0.4);
  ["SLAVA MARLOW · GAZAN · КОБЯКОВ", "TOLY SUMMER · ВОВА СОЛОДКОВ"].forEach((s, j) => {
    ctx.save(); ctx.globalAlpha = a; ctx.font = "800 40px N";
    const tw2 = ctx.measureText(s).width + 60;
    ctx.translate(W / 2, H * 0.36 + 640 + j * 100 + (1 - easeOut(a)) * 40);
    ctx.fillStyle = "rgba(40,0,0,0.75)"; roundRect(-tw2 / 2, -38, tw2, 76, 38); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(s, 0, 2);
    ctx.restore();
  });
}

// ---------- кадр ----------
function renderFrame(f) {
  const t = f / FPS, tw = warp(t);
  const li = lineAt(t);
  const l = li >= 0 ? LINES[li] : LINES[0];
  const type = t > OUTRO_S ? "outro" : l.type;
  const low = env("low", t);
  const frz = freezeAmt(t);
  const kick = pulse(kicks, t, 0.11) * (1 - frz);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over"; ctx.filter = "none"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

  // тряска камеры на «штампах» в припевах и на «бум»
  let shake = 0;
  if (l.hot) { const wi = lastLE(l.words.map(w => w.s), t); if (wi >= 0) shake = Math.exp(-(t - l.words[wi].s) / 0.1) * 16; }
  shake += boomTimes.reduce((m, b) => Math.max(m, t > b ? Math.exp(-(t - b) / 0.15) * 22 : 0), 0);
  ctx.save();
  ctx.translate((hash(f * 1.3) - 0.5) * shake, (hash(f * 2.1) - 0.5) * shake);
  ctx.translate(W / 2, H / 2); ctx.scale(1.02 + 0.015 * kick, 1.02 + 0.015 * kick); ctx.translate(-W / 2, -H / 2);

  drawBG(t, tw, li, kick);
  const C0 = C[t > OUTRO_S ? "red" : l.col];
  drawFloaters(t, tw, kick, C0.dark);
  const spark = type === "gazan" ? 1 : type === "hook" ? 0.6 : type === "final" || type === "outro" ? 0.55 : 0.0;
  drawSparkles(t, tw, spark, kick);
  // пламя: в хуке, финале и на словах про огонь
  const fireBoost = fireTimes.reduce((m, k) => Math.max(m, t > k - 0.05 ? Math.exp(-(t - k) / 0.9) : 0), 0);
  const flameAmt = (type === "intro" ? 1 : type === "final" ? 0.95 : type === "outro" ? 1 : type === "hook" ? 0.55 : 0) + fireBoost * 0.55;
  const bigAmt = type === "intro" ? smooth(t / 0.3) * (1 - smooth((t - 2.3) / 0.3)) : type === "outro" ? smooth((t - OUTRO_S) / 0.4) * 0.9 : 0;
  bigFlame(t, tw, bigAmt, low);
  drawFlames(t, tw, Math.min(1.2, flameAmt), low);
  drawRings(t);
  drawBursts(t);
  // «всё вокруг замирает» — холодный стоп-кадр
  if (frz > 0) { ctx.save(); ctx.globalCompositeOperation = "saturation"; ctx.globalAlpha = 0.75 * frz; ctx.fillStyle = "#888"; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 0.18 * frz; ctx.fillStyle = "#9FDcff"; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  for (let i = Math.max(0, li - 1); i <= Math.min(LINES.length - 1, li + 1); i++) { drawEmojis(i, t, kick); drawLine(i, t, kick); }
  drawOutro(t, tw, low);
  ctx.restore();
  drawBadge(t);
  // глитч на «паранойе»
  for (const g of glitchW) {
    const dt = t - g.s; if (dt < 0 || dt > 0.9) continue;
    const fr = Math.floor(t * 20);
    for (let s = 0; s < 7; s++) { const yy = H * 0.25 + hash(fr * 7 + s) * H * 0.5, hh = 20 + 90 * hash(fr + s * 3), dx = (hash(fr * 3 + s) - 0.5) * 140 * (1 - dt / 0.9); ctx.drawImage(cv, 0, yy, W, hh, dx, yy, W, hh); }
    ctx.save(); ctx.globalCompositeOperation = "difference"; ctx.globalAlpha = 0.5 * (hash(fr) > 0.6 ? 1 : 0) * (1 - dt / 0.9); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H); ctx.restore();
  }
  // вспышка на сильных долях в хуке/финале
  if (HOT[type]) { ctx.save(); ctx.globalAlpha = 0.13 * kick; ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  // лёгкая виньетка
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.72); vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,0.28)");
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  const fade = smooth((t - (D.dur - 0.7)) / 0.65);
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}
window.renderFrame = renderFrame;
Promise.all(["900 50px N", "800 50px N", "900 50px U"].map(f => document.fonts.load(f, "ЖЁжAa"))).then(() => document.fonts.ready).then(() => {
  // заранее рисуем эмодзи-спрайты
  LINES.forEach(l => l.emos.forEach(e => emoSprite(e.e)));
  window.READY = true;
});
</script>
